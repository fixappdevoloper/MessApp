<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MessApp - Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b141a;
      --header-bg: #202c33;
      --text-color: #e9edef;
      --subtext-color: #8696a0;
      --border-color: #222d34;
      --accent-color: #00a884;
      --msg-sent: #005c4b;
      --msg-received: #202c33;
      --input-bg: #2a3942;
    }

    [data-theme="light"] {
      --bg-color: #efeae2;
      --header-bg: #f0f2f5;
      --text-color: #111b21;
      --subtext-color: #667781;
      --border-color: #e9edef;
      --accent-color: #008069;
      --msg-sent: #d9fdd3;
      --msg-received: #ffffff;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', -apple-system, Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background: var(--header-bg); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); z-index: 100; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn { background: transparent; border: none; color: var(--text-color); font-size: 18px; cursor: pointer; padding: 4px; }
    
    .profile-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .avatar-container { position: relative; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-color); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; text-transform: uppercase; }
    .status-dot { width: 11px; height: 11px; border-radius: 50%; background: #8696a0; position: absolute; bottom: 0; right: 0; border: 2px solid var(--header-bg); }
    .status-dot.online { background: #00a884; }

    .user-info .name { font-size: 16px; font-weight: 700; color: var(--text-color); line-height: 1.2; }
    .user-info .status-text { font-size: 12px; color: var(--subtext-color); }

    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
    .msg-wrapper.sent { align-self: flex-end; }
    .msg-wrapper.received { align-self: flex-start; }

    .message { padding: 8px 12px; border-radius: 12px; font-size: 14.5px; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.15); user-select: none; cursor: pointer; }
    .sent .message { background: var(--msg-sent); color: var(--text-color); border-top-right-radius: 2px; }
    .received .message { background: var(--msg-received); color: var(--text-color); border-top-left-radius: 2px; }
    
    .msg-deleted { font-style: italic; opacity: 0.7; }
    .msg-time { font-size: 10px; color: var(--subtext-color); float: right; margin-top: 4px; margin-left: 10px; }

    .emoji-picker { display: none; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 12px; background: var(--header-bg); border-top: 1px solid var(--border-color); max-height: 160px; overflow-y: auto; text-align: center; font-size: 20px; }
    .emoji-picker span { cursor: pointer; padding: 4px; border-radius: 4px; }
    .emoji-picker span:hover { background: var(--input-bg); }

    .format-bar { display: flex; gap: 12px; background: var(--header-bg); padding: 6px 16px; border-top: 1px solid var(--border-color); font-size: 13px; color: var(--subtext-color); }
    .format-btn { cursor: pointer; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .format-btn:hover { background: var(--input-bg); color: var(--text-color); }

    .input-area { background: var(--header-bg); padding: 8px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border-color); position: sticky; bottom: 0; }
    .input-btn { background: transparent; border: none; color: var(--subtext-color); font-size: 20px; cursor: pointer; padding: 6px; }
    
    .input-box { flex: 1; background: var(--input-bg); border: none; border-radius: 20px; padding: 10px 16px; color: var(--text-color); outline: none; font-size: 15px; }
    .send-btn { background: var(--accent-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    .action-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end; }
    .action-sheet { background: var(--header-bg); width: 100%; max-width: 500px; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .action-item { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; color: var(--text-color); }
    .action-item:hover { background: var(--input-bg); }
    .action-item.danger { color: #f44336; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="back-btn" onclick="location.href='home.html'"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="profile-wrap">
      <div class="avatar-container">
        <div class="avatar" id="targetAvatar">U</div>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="user-info">
        <div class="name" id="targetName">User</div>
        <div class="status-text" id="statusText">Offline</div>
      </div>
    </div>
  </div>
</header>

<div class="chat-box" id="chatBox"></div>

<div class="format-bar">
  <span>Formatting:</span>
  <span class="format-btn" onclick="applyFormat('*')"><b>B</b></span>
  <span class="format-btn" onclick="applyFormat('_')"><i>I</i></span>
  <span class="format-btn" onclick="applyFormat('~')"><del>S</del></span>
</div>

<div class="emoji-picker" id="emojiPicker">
  <span onclick="addEmoji('😊')">😊</span><span onclick="addEmoji('😂')">😂</span>
  <span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('👍')">👍</span>
  <span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('🙏')">🙏</span>
  <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😎')">😎</span>
</div>

<div class="input-area">
  <button class="input-btn" id="emojiToggleBtn"><i class="fa-regular fa-face-smile"></i></button>
  <input type="text" class="input-box" id="msgInput" placeholder="Message aalein..." autocomplete="off">
  <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<div class="action-modal" id="actionModal" onclick="closeActionModal(event)">
  <div class="action-sheet" onclick="event.stopPropagation()">
    <div class="action-item" onclick="copyMessage()"><i class="fa-regular fa-copy"></i> Copy</div>
    <div class="action-item" onclick="resendMessage()"><i class="fa-solid fa-rotate-right"></i> Resend</div>
    <div class="action-item danger" onclick="deleteMessage('me')"><i class="fa-solid fa-trash-can"></i> Delete for me</div>
    <div class="action-item danger" id="deleteEveryoneBtn" onclick="deleteMessage('everyone')"><i class="fa-solid fa-users-slash"></i> Delete for everyone</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD68Gmuz3JmwC570rX4h0ShxMe2O8QYLug",
    authDomain: "exemplary-proxy-423103-s4.firebaseapp.com",
    databaseURL: "https://exemplary-proxy-423103-s4-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "exemplary-proxy-423103-s4",
    storageBucket: "exemplary-proxy-423103-s4.firebasestorage.app",
    messagingSenderId: "454413347434",
    appId: "1:454413347434:web:d68e8ecf337a333418b813"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let currentUser = null;
  let targetUser = null;
  let activeRoomId = null;
  let selectedMsgData = null;
  let pressTimer = null;
  let myProfileData = {};

  const savedTheme = localStorage.getItem('messapp_theme');
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

  const urlParams = new URLSearchParams(window.location.search);
  const targetUid = urlParams.get('uid');

  auth.onAuthStateChanged(user => {
    if (user) {
      currentUser = user;
      fetchMyProfile();
      setupPresence(user.uid);
      initChat();
    } else {
      window.location.href = 'login.html';
    }
  });

  function fetchMyProfile() {
    db.ref(`users/${currentUser.uid}`).once('value', snap => {
      if (snap.exists()) myProfileData = snap.val();
    });
  }

  function initChat() {
    const cachedTarget = localStorage.getItem('messapp_active_target');
    if (cachedTarget) {
      targetUser = JSON.parse(cachedTarget);
      renderHeaderInfo();
    }

    if (targetUid) {
      activeRoomId = getChatRoomId(currentUser.uid, targetUid);
      listenPresence();
      loadMessages();
    }
  }

  function renderHeaderInfo() {
    if(!targetUser) return;
    document.getElementById('targetName').innerText = targetUser.fullName || 'User';
    document.getElementById('targetAvatar').innerText = targetUser.fullName ? targetUser.fullName.charAt(0) : 'U';
  }

  function listenPresence() {
    db.ref('status/' + targetUid).on('value', snap => {
      const val = snap.val();
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (val && val.state === 'online') {
        dot.classList.add('online');
        text.innerText = 'Online';
      } else {
        dot.classList.remove('online');
        text.innerText = 'Offline';
      }
    });
  }

  function setupPresence(uid) {
    const myStatusRef = db.ref('status/' + uid);
    db.ref('.info/connected').on('value', snap => {
      if (!snap.val()) return;
      myStatusRef.onDisconnect().set({ state: 'offline', last_changed: Date.now() }).then(() => {
        myStatusRef.set({ state: 'online', last_changed: Date.now() });
      });
    });
  }

  function loadMessages() {
    db.ref('chats/' + activeRoomId).on('value', snapshot => {
      const messages = [];
      snapshot.forEach(child => {
        const msgKey = child.key;
        const msgVal = child.val();

        // Mark as Read if recipient reads it
        if (msgVal.sender !== currentUser.uid && !msgVal.read) {
          db.ref(`chats/${activeRoomId}/${msgKey}`).update({ read: true });
        }

        messages.push({ id: msgKey, ...msgVal });
      });
      renderMessagesList(messages);
      scrollToBottom();
    });
  }

  function renderMessagesList(messages) {
    const chatBox = document.getElementById('chatBox');
    chatBox.innerHTML = '';

    messages.forEach(msg => {
      if (msg.deletedFor && msg.deletedFor[currentUser.uid]) return;

      const isSent = msg.sender === currentUser.uid;
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `msg-wrapper ${isSent ? 'sent' : 'received'}`;

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      
      let formattedText = msg.isDeleted ? '<span class="msg-deleted"><i class="fa-solid fa-ban"></i> Deleted</span>' : parseMarkdown(msg.text);
      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      msgDiv.innerHTML = `${formattedText} <span class="msg-time">${timeStr}</span>`;

      msgDiv.addEventListener('touchstart', (e) => startHold(e, msg), {passive: true});
      msgDiv.addEventListener('touchend', endHold);
      msgDiv.addEventListener('mousedown', (e) => startHold(e, msg));
      msgDiv.addEventListener('mouseup', endHold);

      msgWrapper.appendChild(msgDiv);
      chatBox.appendChild(msgWrapper);
    });
  }

  function parseMarkdown(text) {
    if(!text) return '';
    let escaped = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped
      .replace(/\*(.*?)\*/g, '<b>$1</b>')
      .replace(/_(.*?)_/g, '<i>$1</i>')
      .replace(/~(.*?)~/g, '<del>$1</del>');
  }

  function scrollToBottom() {
    const chatBox = document.getElementById('chatBox');
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeRoomId) return;

    const timestamp = Date.now();

    // 1. Push Message to Chat
    db.ref('chats/' + activeRoomId).push({
      sender: currentUser.uid,
      text: text,
      timestamp: timestamp,
      read: false
    });

    // 2. Push Realtime Notification to Target User
    db.ref(`notifications/${targetUid}`).push({
      senderUid: currentUser.uid,
      senderName: myProfileData.fullName || 'MessApp User',
      text: text,
      timestamp: timestamp,
      read: false
    });

    input.value = '';
    document.getElementById('emojiPicker').style.display = 'none';
  }

  document.getElementById('emojiToggleBtn').addEventListener('click', () => {
    const picker = document.getElementById('emojiPicker');
    picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
  });

  function addEmoji(emoji) {
    document.getElementById('msgInput').value += emoji;
  }

  function applyFormat(symbol) {
    const input = document.getElementById('msgInput');
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const selected = input.value.substring(start, end);
    if(selected) {
      input.value = input.value.substring(0, start) + symbol + selected + symbol + input.value.substring(end);
    } else {
      input.value += symbol + symbol;
    }
  }

  function startHold(e, msg) { pressTimer = setTimeout(() => openActionModal(msg), 500); }
  function endHold() { clearTimeout(pressTimer); }

  function openActionModal(msg) {
    selectedMsgData = msg;
    document.getElementById('deleteEveryoneBtn').style.display = (msg.sender === currentUser.uid && !msg.isDeleted) ? 'flex' : 'none';
    document.getElementById('actionModal').style.display = 'flex';
  }

  function closeActionModal() { document.getElementById('actionModal').style.display = 'none'; }

  function copyMessage() {
    if(selectedMsgData?.text) navigator.clipboard.writeText(selectedMsgData.text);
    closeActionModal();
  }

  function resendMessage() {
    if(selectedMsgData?.text) {
      document.getElementById('msgInput').value = selectedMsgData.text;
      sendMessage();
    }
    closeActionModal();
  }

  function deleteMessage(type) {
    if (!selectedMsgData) return;
    if (type === 'everyone') {
      db.ref(`chats/${activeRoomId}/${selectedMsgData.id}`).update({ isDeleted: true, text: '' });
    } else {
      db.ref(`chats/${activeRoomId}/${selectedMsgData.id}/deletedFor/${currentUser.uid}`).set(true);
    }
    closeActionModal();
  }

  function getChatRoomId(uid1, uid2) {
    return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
  }
</script>
</body>
</html>
